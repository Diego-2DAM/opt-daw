<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Reserva de Entradas</title>
</head>
<body>

    <h1>Taquilla Digital de Teatro</h1>
    <h2>Reserva de Entradas</h2>

    <form action="/reservar" method="POST">

            <p>

                <label for = "eventoId">Introduce identificador de la Obra:</label>
                <input type="number" id="eventoId" name="eventoId" required>

            </p>

            <p>

                <label for = "nombreCliente">Nombre:</label>
                <input type="text" id="nombreCliente" name="nombreCliente" required>

            </p>

            <p>

                <label for = "tipoEntrada">Elige Zona:</label>

                <select id = "tipoEntrada" name="tipoEntrada">
                    <option value="General">General</option>
                    <option value="VIP">VIP</option>
                </select>

            </p>

            <p>
                <label for = "cantidad">Número de Entradas</label>
                <input type="number" id="cantidad" name="cantidad" required>
            </p>

            <p>
                <label for = "codigoCupon">Cupón de Descuento:</label>
                <input type="text" id="codigoCupon" name="codigoCupon">
            </p>

            <button>Reservar</button>


    </form>



</body>
</html>
