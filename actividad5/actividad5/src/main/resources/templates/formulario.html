<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

<h1>Formulario de usuario</h1>

<form action="/procesar" method="post">

    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <br><br>

    <label>Edad:</label>
    <input type="number" name="edad" required>

    <br><br>

    <button type="submit">Enviar</button>

</form>

</body>
</html>
